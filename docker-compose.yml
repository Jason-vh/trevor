services:
  app:
    build: .
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      PORT: 3000
      DATA_DIR: /app/data
    volumes:
      # A named volume, because the deploy replaces the checkout directory on every push.
      - data:/app/data
    ports:
      - "127.0.0.1:${TREVOR_APP_HOST_PORT:-3007}:3000"

volumes:
  data:
