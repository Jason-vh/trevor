<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#fafaf7" />
    <title>Trevor</title>
    <style>
      * {
        box-sizing: border-box;
      }

      :root {
        --paper: #fafaf7;
        --card: #ffffff;
        --line: #e8e6e0;
        --wash: #f2f1ec;
        --ink: #16181d;
        --ink-2: #4a4e57;
        --muted: #8a8d94;
        --red: #d63a2a;
        --red-wash: #fdf0ee;
        --radius: 16px;
      }

      html {
        background: var(--paper);
      }

      body {
        margin: 0;
        color: var(--ink);
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        font-feature-settings: "tnum";
        -webkit-font-smoothing: antialiased;
      }

      .page {
        max-width: 920px;
        margin: 0 auto;
        padding: max(28px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right))
          calc(48px + env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
      }

      .masthead {
        display: flex;
        flex-wrap: wrap;
        align-items: flex-end;
        justify-content: space-between;
        gap: 12px 24px;
        padding-bottom: 18px;
        border-bottom: 2px solid var(--red);
      }

      .brand {
        margin: 0;
        font-size: 30px;
        font-weight: 750;
        letter-spacing: -0.035em;
        line-height: 1;
      }

      .brand-sub {
        margin-top: 6px;
        font-size: 14px;
        color: var(--muted);
      }

      .legend {
        display: flex;
        gap: 16px;
        margin: 0;
        padding: 0;
        list-style: none;
        font-size: 13px;
        color: var(--ink-2);
      }

      .legend li {
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .swatch {
        width: 12px;
        height: 12px;
        border-radius: 4px;
      }

      .swatch.is-booked {
        background: var(--red);
      }

      .swatch.is-queued {
        box-shadow: inset 0 0 0 1.5px var(--red);
      }

      .swatch.is-weekly {
        background: var(--wash);
        box-shadow: inset 0 0 0 1px var(--line);
      }

      .next {
        margin-top: 24px;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px 20px;
        padding: 20px 22px;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: var(--radius);
      }

      .next-label {
        width: 100%;
        font-size: 12px;
        font-weight: 650;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--red);
      }

      .next-when {
        font-size: 22px;
        font-weight: 700;
        letter-spacing: -0.02em;
      }

      .next-detail {
        font-size: 16px;
        color: var(--ink-2);
      }

      .months {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(min(100%, 400px), 1fr));
        gap: 32px 28px;
        margin-top: 32px;
      }

      .month-name {
        margin: 0 0 12px;
        font-size: 20px;
        font-weight: 700;
        letter-spacing: -0.02em;
      }

      .month-name span {
        color: var(--muted);
        font-weight: 500;
      }

      .weekdays,
      .grid {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        gap: 4px;
      }

      .weekdays {
        margin-bottom: 6px;
      }

      .weekdays span {
        font-size: 12px;
        font-weight: 600;
        color: var(--muted);
        text-align: center;
      }

      .day {
        aspect-ratio: 1;
        min-height: 44px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 3px;
        padding: 0;
        border: 0;
        border-radius: 10px;
        background: transparent;
        color: var(--ink);
        font: inherit;
      }

      .day.blank {
        visibility: hidden;
      }

      .day.past {
        color: #c5c6c9;
      }

      .day-num {
        font-size: 15px;
        font-weight: 550;
        line-height: 1;
      }

      .day.today .day-num {
        display: grid;
        place-items: center;
        width: 26px;
        height: 26px;
        margin: -5px 0;
        border-radius: 999px;
        background: var(--ink);
        color: #fff;
      }

      .day-time {
        font-size: 11px;
        font-weight: 650;
        line-height: 1;
      }

      button.day {
        cursor: pointer;
        transition:
          transform 80ms ease,
          filter 120ms ease;
      }

      button.day:hover {
        filter: brightness(0.96);
      }

      button.day:active {
        transform: scale(0.95);
      }

      button.day:focus-visible {
        outline: 2px solid var(--ink);
        outline-offset: 2px;
      }

      .day.is-booked {
        background: var(--red);
        color: #fff;
      }

      .day.is-queued {
        background: var(--red-wash);
        box-shadow: inset 0 0 0 1.5px var(--red);
        color: var(--red);
      }

      .day.is-weekly {
        background: var(--wash);
        color: var(--ink-2);
      }

      .notice {
        grid-column: 1 / -1;
        padding: 32px 0;
        text-align: center;
        color: var(--muted);
      }

      .details {
        width: min(440px, calc(100% - 32px));
        padding: 0;
        border: 1px solid var(--line);
        border-radius: 20px;
        background: var(--card);
        color: var(--ink);
        box-shadow: 0 24px 60px -20px rgba(22, 24, 29, 0.35);
      }

      .details[open] {
        animation: rise 220ms cubic-bezier(0.2, 0.8, 0.2, 1);
      }

      .details::backdrop {
        background: rgba(22, 24, 29, 0.32);
      }

      @keyframes rise {
        from {
          transform: translateY(12px);
          opacity: 0;
        }
      }

      .details-inner {
        padding: 22px 22px 24px;
      }

      .details-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 16px;
      }

      .details-title {
        margin: 0;
        font-size: 20px;
        font-weight: 700;
        letter-spacing: -0.02em;
      }

      .details-close {
        width: 32px;
        height: 32px;
        border: 0;
        border-radius: 999px;
        background: var(--wash);
        color: var(--ink-2);
        font: inherit;
        font-size: 18px;
        line-height: 1;
        cursor: pointer;
      }

      .sessions {
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .session {
        display: grid;
        grid-template-columns: 4px 1fr;
        gap: 14px;
        padding: 14px 16px 14px 14px;
        border: 1px solid var(--line);
        border-radius: 12px;
      }

      .session-bar {
        border-radius: 4px;
      }

      .session.is-booked .session-bar {
        background: var(--red);
      }

      .session.is-queued .session-bar {
        box-shadow: inset 0 0 0 1.5px var(--red);
      }

      .session.is-weekly .session-bar {
        background: var(--line);
      }

      .session-status {
        font-size: 12px;
        font-weight: 650;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--muted);
      }

      .session.is-booked .session-status,
      .session.is-queued .session-status {
        color: var(--red);
      }

      .session-time {
        margin-top: 4px;
        font-size: 20px;
        font-weight: 700;
        letter-spacing: -0.01em;
      }

      .session-detail {
        margin-top: 2px;
        font-size: 15px;
        color: var(--ink-2);
      }

      @media (max-width: 520px) {
        .details {
          width: 100%;
          max-width: 100%;
          margin: auto 0 0;
          border-radius: 20px 20px 0 0;
          border-bottom: 0;
        }

        .details-inner {
          padding-bottom: max(24px, env(safe-area-inset-bottom));
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <header class="masthead">
        <div>
          <h1 class="brand">Trevor</h1>
          <div class="brand-sub">Squash at SquashCity</div>
        </div>
        <ul class="legend">
          <li><i class="swatch is-booked"></i>Booked</li>
          <li><i class="swatch is-queued"></i>Queued</li>
          <li><i class="swatch is-weekly"></i>Weekly</li>
        </ul>
      </header>

      <section id="next" class="next" hidden></section>

      <div id="months" class="months"><p class="notice">Loading…</p></div>
    </main>

    <dialog id="details" class="details" aria-labelledby="details-title">
      <div class="details-inner">
        <div class="details-header">
          <h2 id="details-title" class="details-title"></h2>
          <button type="button" class="details-close" aria-label="Close">×</button>
        </div>
        <ul id="details-sessions" class="sessions"></ul>
      </div>
    </dialog>

    <script>
      const STATUS_ORDER = ["booked", "queued", "weekly"];
      const WEEKDAYS = ["Mo", "Tu", "We", "Th", "Fr", "Sa", "Su"];
      const STATUS_LABELS = { booked: "Booked", queued: "Queued", weekly: "Weekly" };

      const details = document.getElementById("details");
      let sessionsByDate = new Map();

      // Dates are calendar days ("YYYY-MM-DD"), so all arithmetic happens in UTC to stay timezone-free.
      function dateFromKey(key) {
        const [year, month, day] = key.split("-").map(Number);
        return new Date(Date.UTC(year, month - 1, day));
      }

      function keyFromDate(date) {
        return date.toISOString().slice(0, 10);
      }

      function addDays(key, days) {
        const date = dateFromKey(key);
        date.setUTCDate(date.getUTCDate() + days);
        return keyFromDate(date);
      }

      function formatDate(key, options) {
        return new Intl.DateTimeFormat("en-GB", { ...options, timeZone: "UTC" }).format(dateFromKey(key));
      }

      function relativeDay(date, today) {
        if (date === today) return "Today";
        if (date === addDays(today, 1)) return "Tomorrow";
        return formatDate(date, { weekday: "long", day: "numeric", month: "long" });
      }

      function element(tag, className, text) {
        const node = document.createElement(tag);
        if (className) node.className = className;
        if (text !== undefined) node.textContent = text;
        return node;
      }

      function sessionDetail(session) {
        if (session.status === "booked") return session.court;
        if (session.status === "queued") return "Looking for a court starting in this window";
        return "Weekly, queued once SquashCity opens the day";
      }

      function monthsBetween(today, until) {
        const start = dateFromKey(today);
        const end = dateFromKey(until);
        const count =
          (end.getUTCFullYear() - start.getUTCFullYear()) * 12 + end.getUTCMonth() - start.getUTCMonth() + 1;
        return Array.from({ length: count }, (_, offset) => monthOf(start, offset));
      }

      function monthOf(start, offset) {
        const first = new Date(Date.UTC(start.getUTCFullYear(), start.getUTCMonth() + offset, 1));
        const firstKey = keyFromDate(first);
        const lastKey = keyFromDate(new Date(Date.UTC(first.getUTCFullYear(), first.getUTCMonth() + 1, 0)));

        const cells = Array.from({ length: (first.getUTCDay() + 6) % 7 }, () => null);
        for (let date = firstKey; date <= lastKey; date = addDays(date, 1)) cells.push(date);

        const year = first.getUTCFullYear();
        return {
          name: formatDate(firstKey, { month: "long" }),
          year: year === start.getUTCFullYear() ? null : year,
          cells,
        };
      }

      function leadingSession(sessions) {
        for (const status of STATUS_ORDER) {
          const session = sessions.find((each) => each.status === status);
          if (session) return session;
        }
      }

      function renderDay(date, today) {
        if (!date) return element("span", "day blank");

        const number = element("span", "day-num", String(dateFromKey(date).getUTCDate()));
        const sessions = sessionsByDate.get(date) ?? [];
        if (date < today || sessions.length === 0) {
          const day = element("span", date < today ? "day past" : "day");
          if (date === today) day.classList.add("today");
          day.append(number);
          return day;
        }

        const lead = leadingSession(sessions);
        const day = element("button", `day is-${lead.status}`);
        day.type = "button";
        day.setAttribute("aria-label", `${relativeDay(date, today)}: ${sessions.length} session(s)`);
        if (date === today) day.classList.add("today");
        day.append(number, element("span", "day-time", lead.timeFrom));
        day.addEventListener("click", () => openDay(date, today));
        return day;
      }

      function renderMonth(month, today) {
        const section = element("section", "month");
        const name = element("h2", "month-name", month.name);
        if (month.year) name.append(" ", element("span", null, String(month.year)));

        const weekdays = element("div", "weekdays");
        weekdays.append(...WEEKDAYS.map((weekday) => element("span", null, weekday)));

        const grid = element("div", "grid");
        grid.append(...month.cells.map((date) => renderDay(date, today)));

        section.append(name, weekdays, grid);
        return section;
      }

      function renderNext(sessions, today) {
        const next = document.getElementById("next");
        const booked = sessions.find((session) => session.status === "booked");
        const upcoming = booked ?? sessions[0];
        if (!upcoming) {
          next.replaceChildren(
            element("div", "next-label", "Up next"),
            element("div", "next-when", "Nothing planned yet"),
            element("div", "next-detail", "Ask Trevor in the chat to book a court"),
          );
        } else {
          next.replaceChildren(
            element("div", "next-label", booked ? "Up next" : `Up next · ${STATUS_LABELS[upcoming.status]}`),
            element("div", "next-when", `${relativeDay(upcoming.date, today)}, ${upcoming.timeFrom}`),
            element("div", "next-detail", sessionDetail(upcoming)),
          );
        }
        next.hidden = false;
      }

      function render({ today, until, sessions }) {
        sessionsByDate = new Map();
        for (const session of sessions) {
          sessionsByDate.set(session.date, [...(sessionsByDate.get(session.date) ?? []), session]);
        }

        renderNext(sessions, today);
        const months = monthsBetween(today, until).map((month) => renderMonth(month, today));
        document.getElementById("months").replaceChildren(...months);
      }

      function renderSession(session) {
        const item = element("li", `session is-${session.status}`);
        const body = element("div");
        body.append(
          element("div", "session-status", STATUS_LABELS[session.status]),
          element("div", "session-time", `${session.timeFrom}–${session.timeTo}`),
          element("div", "session-detail", sessionDetail(session)),
        );
        item.append(element("span", "session-bar"), body);
        return item;
      }

      function openDay(date, today) {
        document.getElementById("details-title").textContent = relativeDay(date, today);
        document.getElementById("details-sessions").replaceChildren(...sessionsByDate.get(date).map(renderSession));
        details.showModal();
      }

      details.querySelector(".details-close").addEventListener("click", () => details.close());
      details.addEventListener("click", (event) => {
        if (event.target === details) details.close();
      });

      async function load() {
        try {
          const response = await fetch("/api/sessions");
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          render(await response.json());
        } catch {
          document.getElementById("months").replaceChildren(element("p", "notice", "Couldn't load the sessions"));
        }
      }

      load();
    </script>
  </body>
</html>
